spring.application.name=inventory-service

spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.datasource.url=jdbc:mysql://localhost:3306/hospital_inventory?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

auth.jwt.secret=phase-2-local-jwt-secret-key-change-this
auth.jwt.access-token-expiration-seconds=900
auth.jwt.refresh-token-expiration-seconds=1209600

inventory.core.base-url=http://localhost:8080
app.cors.allowed-origin=http://localhost:5173
