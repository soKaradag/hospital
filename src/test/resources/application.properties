spring.datasource.url=jdbc:h2:mem:hospital_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.flyway.enabled=false
spring.jpa.open-in-view=false
auth.jwt.secret=phase-2-test-jwt-secret-key-change-this
auth.jwt.access-token-expiration-seconds=900
auth.jwt.refresh-token-expiration-seconds=1209600
