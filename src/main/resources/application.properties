spring.application.name=hospital

# JSON tarih/saat değerleri UTC olarak üretilir.
spring.jackson.time-zone=UTC

# Hibernate tarafında JDBC zaman değerleri UTC kabul edilerek işlenir.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Değerler ortam değişkenlerinden okunur; yoksa yerel geliştirme varsayılanları kullanılır.
# useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC bu parametreler Türkçe karakter desteği için önemlidir.
# useSSL=false bu parametre SSL bağlantısını devre dışı bırakır.
# Veritabanı ismi hospital.
spring.datasource.url=jdbc:mysql://localhost:3306/hospital?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
# root kullanıcı için şifre yok. Kendi şifrenizi giriniz.
spring.datasource.username=root
spring.datasource.password=

# MySQL için uygun dialect seçimi Hibernate tarafından otomatik yapılır.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQL şeması harici scriptlerle yönetildiği için Hibernate tablo üretmez.
spring.jpa.hibernate.ddl-auto=none

# MySQL tarafında uygun dialect seçimi Hibernate tarafından otomatik yapılır.
spring.jpa.open-in-view=false

# Faz 2 auth token ayarları.
auth.jwt.secret=phase-2-local-jwt-secret-key-change-this
auth.jwt.access-token-expiration-seconds=900
auth.jwt.refresh-token-expiration-seconds=1209600
